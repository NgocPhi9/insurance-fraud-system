<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Tra cứu theo Nhà cung cấp (Provider)')}"></head>

<body class="bg-light">
  <div class="wrapper d-flex">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <div id="sidebarOverlay" class="sidebar-overlay d-none"></div>
    <div class="main-content d-flex flex-column flex-grow-1">
      <div th:replace="~{layout/navbar :: navbar}"></div>

      <main class="flex-grow-1 p-4">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h5 class="fw-bold mb-0">Tra cứu theo Nhà cung cấp</h5>
          </div>
        </div>

        <!-- Search bar -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body">
            <form th:action="@{/lookup/provider}" method="get" class="row g-3 align-items-center">
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                  </span>
                  <input type="text" name="query" class="form-control border-start-0" placeholder="Nhập mã Nhà cung cấp"
                    th:value="${query}" required>
                  <button type="submit" class="btn btn-primary px-4">Tra cứu</button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Results Section -->
        <div th:if="${query != null}">

          <h6 class="fw-bold mb-3">Kết quả tra cứu cho mã Provider: <span class="text-primary"
              th:text="${query}"></span></h6>

          <!-- Statistics -->
          <div class="row g-3 mb-4" th:if="${totalClaims > 0}">
            <div class="col-md-4">
              <div class="card border-0 shadow-sm bg-primary text-white h-100">
                <div class="card-body text-center">
                  <h6 class="card-title text-white-50">Tổng số Claims</h6>
                  <h2 class="fw-bold mb-0" th:text="${totalClaims}">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 shadow-sm bg-danger text-white h-100">
                <div class="card-body text-center">
                  <h6 class="card-title text-white-50">Claims bị từ chối (REJECTED)</h6>
                  <h2 class="fw-bold mb-0" th:text="${rejectedClaims}">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 shadow-sm bg-success text-white h-100">
                <div class="card-body text-center">
                  <h6 class="card-title text-white-50">Tổng tiền yêu cầu</h6>
                  <h2 class="fw-bold mb-0">
                    $<span th:text="${#numbers.formatDecimal(totalAmount, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                  </h2>
                </div>
              </div>
            </div>
          </div>

          <!-- Table -->
          <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="claimsTable">
                  <thead class="table-light">
                    <tr>
                      <th class="ps-3">Claim ID</th>
                      <th>Từ ngày</th>
                      <th>Đến ngày</th>
                      <th>Số tiền</th>
                      <th class="text-center">Trạng thái</th>
                      <th class="text-center pe-3">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="claim : ${claims}" class="claim-row">
                      <td class="ps-3">
                        <span class="fw-semibold text-primary"
                          th:text="'#' + ${claim.rawClaimId}"></span>
                      </td>
                      <td th:text="${claim.clmFromDt} ?: '—'"></td>
                      <td th:text="${claim.clmThruDt} ?: '—'"></td>
                      <td>
                        <span th:if="${claim.clmPmtAmt != null}"
                          th:text="'$' + ${#numbers.formatDecimal(claim.clmPmtAmt, 1, 'COMMA', 2, 'POINT')}">
                        </span>
                        <span th:unless="${claim.clmPmtAmt != null}">—</span>
                      </td>

                      <!-- Trạng thái -->
                      <td class="text-center">
                        <span th:switch="${claim.claimStatus?.name()}">
                          <span th:case="'PENDING'" class="badge bg-secondary">Pending</span>
                          <span th:case="'FLAGGED'" class="badge bg-warning text-dark">Flagged</span>
                          <span th:case="'UNDER_REVIEW'" class="badge bg-info text-dark">Under Review</span>
                          <span th:case="'APPROVED'" class="badge bg-success">Approved</span>
                          <span th:case="'REJECTED'" class="badge bg-danger">Rejected</span>
                        </span>
                      </td>

                      <!-- Thao tác -->
                      <td class="text-center pe-3">
                        <a th:href="@{/claims/{id}(id=${claim.rawClaimId})}" class="btn btn-sm btn-outline-primary"
                          data-bs-toggle="tooltip" data-bs-placement="top" title="Xem chi tiết">
                          <i class="bi bi-eye"></i>
                        </a>
                      </td>
                    </tr>

                    <!-- Empty state -->
                    <tr th:if="${claims == null || claims.isEmpty()}">
                      <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        Không tìm thấy claims nào cho nhà cung cấp này
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>

      </main>

      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
  </div>
  <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
