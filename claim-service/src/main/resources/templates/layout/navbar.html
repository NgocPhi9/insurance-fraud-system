    <div class="d-flex align-items-center gap-3">

                    </a>
                </li>
                <!-- Breadcrumb trung gian (nếu có) -->
                <th:block th:if="${breadcrumbParent}">
                    <li class="breadcrumb-item text-muted"

                </th:block>
                <!-- Breadcrumb hiện tại -->
                <li class="breadcrumb-item active fw-semibold"
                    aria-current="page"
                    th:text="${breadcrumbCurrent} ?: 'Dashboard'">Dashboard</li>
