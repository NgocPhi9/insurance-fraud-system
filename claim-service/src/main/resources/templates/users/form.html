<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Chỉnh sửa Tài khoản' : 'Tạo Tài khoản')}"></head>
<body class="bg-light">
<div class="wrapper d-flex">
  <div th:replace="~{layout/sidebar :: sidebar}"></div>
  <div id="sidebarOverlay" class="sidebar-overlay d-none"></div>
  <div class="main-content d-flex flex-column flex-grow-1">
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1 p-4">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h5 class="fw-bold mb-0"
              th:text="${isEdit} ? 'Chỉnh sửa tài khoản' : 'Tạo tài khoản mới'">
            Tạo tài khoản mới
          </h5>
          <span class="text-muted small"
                th:text="${isEdit} ? 'Cập nhật thông tin và role cho tài khoản' : 'Thêm người dùng mới vào hệ thống'">
          </span>
        </div>
        <a th:href="@{/users}" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
      </div>

      <!-- Error message -->
      <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show py-2 mb-3" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-7">

          <!-- Form card -->
          <div class="card border-0 shadow-sm">

            <!-- Card header: avatar + email (chỉ hiện khi edit) -->
            <div th:if="${isEdit}" class="card-header bg-white border-bottom py-3">
              <div class="d-flex align-items-center gap-3">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center
                            justify-content-center flex-shrink-0"
                     style="width:48px;height:48px;font-size:1.1rem;">
                  <span th:text="${#strings.toUpperCase(#strings.substring(targetUser.fullName,0,1))}">A</span>
                </div>
                <div>
                  <div class="fw-semibold" th:text="${targetUser.fullName}">Tên người dùng</div>
                  <div class="text-muted small" th:text="${targetUser.email}">email@example.com</div>
                  <span th:switch="${targetUser.status}">
                    <span th:case="'ACTIVE'" class="badge bg-success-subtle text-success border border-success-subtle" style="font-size:0.7rem;">
                      <i class="bi bi-circle-fill me-1" style="font-size:0.45rem;"></i>Hoạt động
                    </span>
                    <span th:case="*" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" style="font-size:0.7rem;">
                      <i class="bi bi-lock-fill me-1" style="font-size:0.6rem;"></i>Bị khóa
                    </span>
                  </span>
                </div>
              </div>
            </div>

            <div class="card-body p-4">

              <!-- ─── Form tạo mới ─── -->
              <form th:if="${!isEdit}"
                    th:action="@{/users/create}"
                    th:object="${userForm}"
                    method="post"
                    novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="row g-3">
                  <!-- Họ tên -->
                  <div class="col-12">
                    <label class="form-label fw-semibold small">
                      Họ và tên <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control"
                           th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           placeholder="Nguyễn Văn A">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                  </div>

                  <!-- Email -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">
                      Email <span class="text-danger">*</span>
                    </label>
                    <input type="email" class="form-control"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="user@company.com">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                  </div>

                  <!-- Mật khẩu -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">
                      Mật khẩu <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                      <input type="password" class="form-control" id="passwordInput"
                             th:field="*{password}"
                             th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                             placeholder="Tối thiểu 6 ký tự">
                      <button class="btn btn-outline-secondary" type="button"
                              onclick="togglePassword()" title="Hiện/ẩn mật khẩu">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                      </button>
                      <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                  </div>

                  <!-- Role -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">
                      Role <span class="text-danger">*</span>
                    </label>
                    <select class="form-select"
                            th:field="*{role}"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                      <option value="">-- Chọn role --</option>
                      <option th:each="r : ${roles}"
                              th:value="${r.name()}"
                              th:text="${r.name()}">
                      </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}"></div>
                  </div>

                  <!-- Phòng ban -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">Phòng ban</label>
                    <input type="text" class="form-control"
                           th:field="*{department}"
                           placeholder="VD: Phòng điều tra">
                  </div>

                  <!-- Số điện thoại -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">Số điện thoại</label>
                    <input type="text" class="form-control"
                           th:field="*{phoneNumber}"
                           placeholder="0901234567">
                  </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                  <a th:href="@{/users}" class="btn btn-outline-secondary">Hủy</a>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-person-plus me-1"></i>Tạo tài khoản
                  </button>
                </div>
              </form>

              <!-- ─── Form chỉnh sửa ─── -->
              <form th:if="${isEdit}"
                    th:action="@{/users/{id}/edit(id=${targetUser.userId})}"
                    th:object="${userForm}"
                    method="post"
                    novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="row g-3">
                  <!-- Họ tên -->
                  <div class="col-12">
                    <label class="form-label fw-semibold small">
                      Họ và tên <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control"
                           th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           placeholder="Nguyễn Văn A">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                  </div>

                  <!-- Email (chỉ đọc khi edit) -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">Email</label>
                    <input type="email" class="form-control bg-light"
                           th:value="${targetUser.email}"
                           readonly
                           title="Email không thể thay đổi">
                    <div class="form-text">Email không thể thay đổi</div>
                  </div>

                  <!-- Role -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">
                      Role <span class="text-danger">*</span>
                    </label>
                    <select class="form-select"
                            th:field="*{role}"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                      <option th:each="r : ${roles}"
                              th:value="${r.name()}"
                              th:text="${r.name()}"
                              th:selected="${r.name() == userForm.role}">
                      </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}"></div>
                  </div>

                  <!-- Phòng ban -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">Phòng ban</label>
                    <input type="text" class="form-control"
                           th:field="*{department}"
                           placeholder="VD: Phòng điều tra">
                  </div>

                  <!-- Số điện thoại -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">Số điện thoại</label>
                    <input type="text" class="form-control"
                           th:field="*{phoneNumber}"
                           placeholder="0901234567">
                  </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                  <a th:href="@{/users}" class="btn btn-outline-secondary">Hủy</a>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-floppy me-1"></i>Lưu thay đổi
                  </button>
                </div>
              </form>

            </div><!-- /card-body -->
          </div><!-- /card -->

          <!-- Role guide card -->
          <div class="card border-0 shadow-sm mt-3">
            <div class="card-header bg-white border-bottom py-2">
              <h6 class="mb-0 fw-semibold small">
                <i class="bi bi-info-circle me-2 text-primary"></i>Hướng dẫn phân quyền
              </h6>
            </div>
            <div class="card-body py-2">
              <div class="row g-2">
                <div class="col-md-4">
                  <div class="d-flex align-items-start gap-2">
                    <span class="badge bg-success mt-1 flex-shrink-0">STAFF</span>
                    <span class="text-muted small">Nhập liệu, tạo claim bảo hiểm</span>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="d-flex align-items-start gap-2">
                    <span class="badge bg-primary mt-1 flex-shrink-0">INVESTIGATOR</span>
                    <span class="text-muted small">Điều tra, phán quyết claim gian lận</span>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="d-flex align-items-start gap-2">
                    <span class="badge bg-danger mt-1 flex-shrink-0">ADMIN</span>
                    <span class="text-muted small">Toàn quyền quản trị hệ thống</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script>
  function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }
</script>
</body>
</html>
