<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Fraud Detection System</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="container px-3">
    <div class="login-card card mx-auto">
        <div class="card-body p-4 p-md-5">

            <!-- Brand -->
            <div class="login-brand">
                <i class="bi bi-shield-check"></i>
                <span>FraudDetect</span>
            </div>
            <p class="text-center text-muted mb-4" style="font-size:0.875rem;">
                Hệ thống phát hiện gian lận bảo hiểm
            </p>

            <!-- Error alert -->
            <div th:if="${param.error}"
                 class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span>Email hoặc mật khẩu không chính xác.</span>
            </div>

            <!-- Logout alert -->
            <div th:if="${param.logout}"
                 class="alert alert-success d-flex align-items-center gap-2 py-2" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span>Đăng xuất thành công.</span>
            </div>

            <!-- Form -->
            <form method="post" th:action="@{/auth/login}">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               placeholder="example@fraud.com"
                               autocomplete="email"
                               required
                               autofocus/>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               placeholder="••••••••"
                               autocomplete="current-password"
                               required/>
                        <button class="input-group-text border-start-0"
                                type="button"
                                id="togglePassword"
                                tabindex="-1">
                            <i class="bi bi-eye text-muted" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-muted mt-4" style="font-size: 0.8rem;">
        &copy; 2026 Fraud Detection System &mdash; Khóa luận tốt nghiệp
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
